<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a0e5f"/>
      <stop offset=".52" stop-color="#7a1a8c"/>
      <stop offset="1" stop-color="#e01c86"/>
    </linearGradient>
    <radialGradient id="hi" cx="34" cy="26" r="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cy" x1="64" y1="42" x2="64" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7df4ff"/>
      <stop offset="1" stop-color="#1ac6e6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#10032a" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#hi)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="29.5" fill="none" stroke="#ffffff" stroke-opacity=".14"/>
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <polyline points="43,35 22,64 43,93"/>
    <polyline points="85,35 106,64 85,93"/>
  </g>
  <path d="M53 44 L53 84 L83 64 Z" fill="url(#cy)" filter="url(#glow)"/>
</svg>
